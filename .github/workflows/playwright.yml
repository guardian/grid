name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-tests
    steps:
    - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        # Cache the npm download cache, keyed on the e2e-tests lockfile.
        cache: npm
        cache-dependency-path: e2e-tests/package-lock.json
    - name: Install dependencies
      run: npm ci
    # Cache the downloaded Playwright browser binaries. The cache key is tied to
    # the resolved Playwright version in the lockfile, so a version bump busts it.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('e2e-tests/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      # On a cache hit the browsers are already present, so only install the OS
      # dependencies; otherwise download the browsers too.
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: e2e-tests/images/Dockerfile
        target: ci
        tags: grid-e2e-ci
        push: false
        load: true
    - name: Run Playwright tests
      run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30
