name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  # Required to read/write the buildx layer cache stored as a GHCR package.
  packages: write
jobs:
  test:
    name: test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 60
    runs-on: ubuntu-26.04-arm
    # Playwright's native sharding: each shard boots its own stack and runs a quarter
    # of the scenarios. The merge-reports job combines their blob reports.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    defaults:
      run:
        working-directory: e2e-tests
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.0
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        # Cache downloads for both the host-side e2e install and the Kahuna install
        # performed inside grid-e2e-ci. stack.ts mounts this cache into the container.
        cache: npm
        cache-dependency-path: |
          e2e-tests/package-lock.json
          kahuna/package-lock.json
    - name: Install dependencies
      run: npm ci
    # Persist the sbt ivy/coursier caches across runs. The grid-e2e-ci container
    # runs `sbt e2eStage` at run time and, via dependencyCacheBindMounts() in
    # e2e-tests/setup/stack.ts, bind-mounts these host dirs into the container.
    # Without this the container re-downloads the whole dependency tree from Maven
    # Central every run, which trips Central's 429 rate limiting. Keyed on the sbt
    # build files, with a prefix restore-key so an unrelated build change only
    # fetches the delta rather than everything.
    - name: Cache sbt dependencies (ivy/coursier)
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/coursier/v1
          ~/.ivy2/cache
        key: ${{ runner.os }}-sbt-${{ hashFiles('build.sbt', 'project/plugins.sbt', 'project/build.properties') }}
        restore-keys: |
          ${{ runner.os }}-sbt-
    - name: Ensure sbt cache dirs exist
      # cacheBindMounts() only mounts these into the container when the host dir
      # exists; create them so a cache miss still gets a writable rw mount that
      # the container populates (and this job then saves for next time).
      run: mkdir -p ~/.cache/coursier/v1 ~/.ivy2/cache
    # Persist sbt's incremental-compile output (Zinc analysis + compiled classes
    # in each module's target/ dir) so `sbt e2eStage` (run in the grid container at
    # stack startup, against the bind-mounted repo) only recompiles the Scala that
    # actually changed instead of doing a clean build of all nine services every
    # run. Keyed on the Scala/sbt sources: an exact match means nothing to
    # recompile, and the prefix restore-key seeds an incremental build from the
    # most recent cache when sources have changed.
    - name: Cache sbt compile output (incremental)
      uses: actions/cache@v6
      with:
        path: |
          **/target
          ~/.sbt
        key: ${{ runner.os }}-sbt-build-${{ hashFiles('**/*.scala', '**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
        restore-keys: |
          ${{ runner.os }}-sbt-build-
    # Cache the downloaded Playwright browser binaries. The cache key is tied to
    # the resolved Playwright version in the lockfile, so a version bump busts it.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('e2e-tests/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      # Browser binaries are restored from the cache above, so only download them
      # on a cache miss. We deliberately skip `playwright install-deps` (~20s of
      # apt every run): the GitHub-hosted Ubuntu runner image already ships the
      # system libraries Chromium needs. If a runner image ever drops one, add
      # `--with-deps` back here (and it will only run on cache misses).
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    # Authenticate so buildx can pull (and, on main, push) the registry layer
    # cache. GITHUB_TOKEN is read-only on fork PRs, which is fine: those runs
    # only read the cache (see cache-to condition below).
    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build CI image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: e2e-tests/images/Dockerfile
        target: ci
        tags: grid-e2e-ci
        push: false
        load: true
        # Share layers across branches via a single stable cache ref. Every run
        # reads from :main; only pushes to main write it back (mode=max caches
        # intermediate layers too, so the mise toolchain layer is reused). Only the
        # first shard writes, so parallel shards don't race to push the same ref.
        cache-from: type=registry,ref=ghcr.io/guardian/grid/e2e-ci-cache:main
        cache-to: ${{ github.event_name == 'push' && matrix.shardIndex == 1 && 'type=registry,ref=ghcr.io/guardian/grid/e2e-ci-cache:main,mode=max' || '' }}
    - name: Set up local CA for devcontainer-nginx
      id: local-ca
      run: |
        sudo apt-get update
        sudo apt-get install -y mkcert libnss3-tools
        export CAROOT="$HOME/.local/share/mkcert"
        mkcert -install
        echo "certificate=$CAROOT/rootCA.pem" >> "$GITHUB_OUTPUT"
    - name: Run Playwright tests
      env:
        NODE_EXTRA_CA_CERTS: ${{ steps.local-ca.outputs.certificate }}
        # Coverage runs in the Features UI job instead, to keep this release-path job fast.
        GRID_DISABLE_COVERAGE: 'true'
      run: npm test -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    # Blob reports hold the shard's results and attachments; merge-reports turns
    # them into the HTML and Cucumber reports.
    - name: Upload blob report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: e2e-tests/blob-report/
        retention-days: 1
        if-no-files-found: ignore
    - name: Upload testcontainers log
      id: testcontainers-log
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: testcontainers-log-${{ matrix.shardIndex }}
        path: e2e-tests/logs/
        retention-days: 14
        if-no-files-found: ignore
    # Annotations show on the job page, which doesn't list the run's artifacts.
    - name: Show testcontainers debug log
      if: ${{ failure() && steps.testcontainers-log.outputs.artifact-url != '' }}
      env:
        ARTIFACT_URL: ${{ steps.testcontainers-log.outputs.artifact-url }}
      run: |
        echo "::error title=Testcontainers debug log::If the stack failed to start, see the testcontainers log to help debug. It's printed below, and also available for download at $ARTIFACT_URL"
        cat logs/*/testcontainers.log


  merge-reports:
    # Merge even when shards fail, so failures appear in the combined reports.
    if: ${{ !cancelled() }}
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e-tests
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.0
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: e2e-tests/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Download blob reports
      uses: actions/download-artifact@v7
      with:
        path: e2e-tests/all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
    # The Cucumber reporter needs the generated BDD files and the config, so run
    # bddgen and pass --config. The reporters come from playwright.config.ts.
    - name: Merge reports
      run: npx bddgen && npx playwright merge-reports --config playwright.config.ts ./all-blob-reports
    - name: Upload e2e reports
      uses: actions/upload-artifact@v7
      with:
        name: e2e-report
        path: |
          e2e-tests/playwright-report/
          e2e-tests/cucumber-report/
        retention-days: 14
        if-no-files-found: ignore

  # A single, stable check name for branch protection, independent of the shard count.
  playwright-result:
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Check all shards passed
      if: ${{ needs.test.result != 'success' }}
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "::error::One or more Playwright shards did not pass (result: $RESULT)"
        exit 1
