name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  # Required to read/write the buildx layer cache stored as a GHCR package.
  packages: write
jobs:
  test:
    timeout-minutes: 60
    runs-on: 8core-ubuntu-latest-frontend
    defaults:
      run:
        working-directory: e2e-tests
    steps:
    - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v7.0.0
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        # Cache the npm download cache, keyed on the e2e-tests lockfile.
        cache: npm
        cache-dependency-path: e2e-tests/package-lock.json
    - name: Install dependencies
      run: npm ci
    # Cache the downloaded Playwright browser binaries. The cache key is tied to
    # the resolved Playwright version in the lockfile, so a version bump busts it.
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('e2e-tests/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
    - name: Install Playwright Browsers
      # On a cache hit the browsers are already present, so only install the OS
      # dependencies; otherwise download the browsers too.
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    # Authenticate so buildx can pull (and, on main, push) the registry layer
    # cache. GITHUB_TOKEN is read-only on fork PRs, which is fine: those runs
    # only read the cache (see cache-to condition below).
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build CI image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: e2e-tests/images/Dockerfile
        target: ci
        tags: grid-e2e-ci
        push: false
        load: true
        # Share layers across branches via a single stable cache ref. Every run
        # reads from :main; only pushes to main write it back (mode=max caches
        # intermediate layers too, so the mise toolchain layer is reused).
        cache-from: type=registry,ref=ghcr.io/guardian/grid/e2e-ci-cache:main
        cache-to: ${{ github.event_name == 'push' && 'type=registry,ref=ghcr.io/guardian/grid/e2e-ci-cache:main,mode=max' || '' }}
    - name: Run Playwright tests
      run: npm test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: e2e-tests/playwright-report/
        retention-days: 30
