name: imgproxy package

on:
  pull_request:
    paths:
      - "imgproxy/**"
      - ".github/workflows/imgproxy-package.yml"
  push:
    branches:
      - main
    paths:
      - "imgproxy/**"
      - ".github/workflows/imgproxy-package.yml"
  workflow_dispatch:
    inputs:
      patched:
        description: "Apply Tony's ICC intent patch"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.0
      - name: Build and validate arm64 Debian package
        env:
          PATCHED: ${{ github.event_name != 'workflow_dispatch' || inputs.patched }}
        run: |
          if [ "$PATCHED" = "true" ]; then
            bash ./imgproxy/build-package.sh --patched
          else
            bash ./imgproxy/build-package.sh --unpatched
          fi
      - name: Verify package metadata, SBOM, and notices
        run: bash ./imgproxy/verify-package.sh
      - name: Install and run on Ubuntu 26.04 arm64
        run: bash ./imgproxy/test-package-runtime.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imgproxy-deb
          path: imgproxy/dist/imgproxy.deb
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: imgproxy-deb
          path: imgproxy/dist
      - name: Upload package to Riff-Raff
        uses: guardian/actions-riff-raff@v4.3.7
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          projectName: media-service::imgproxy
          configPath: imgproxy/riff-raff.yaml
          contentDirectories: |
            imgproxy:
              - imgproxy/dist/imgproxy.deb
