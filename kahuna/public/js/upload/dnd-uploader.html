<div class="dnd-uploader" role="region" aria-label="Dropzone" ng-if="dndUploader.activated">
    <div class="dnd-uploader__info">
        <div class="dnd-uploader__heading">Dropzone!</div>
        <div class="dnd-uploader__explainer">{{dndUploader.dropzoneExplanation}}</div>
    </div>
</div>

<div class="dnd-uploader" role="region" aria-label="Importing" ng-if="dndUploader.importing">
    <div class="dnd-uploader__info">
        <div class="dnd-uploader__heading">Importing…</div>
    </div>
</div>
