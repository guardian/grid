# Devenv project configuration
# Edit this file to configure your project's devcontainer
# and then run `devenv generate` to create the devcontainer.json files

name: "grid"

# Modules: Built-in functionality
modules:
  - mise
  - docker-in-docker
  - scala
  - github-copilot

features:
  ghcr.io/devcontainers/features/aws-cli:1.1.4: {}

# Optional: Ports to forward
forwardPorts:
  - 9001
  - 9002
  - 9003
  - 9004
  - 9005
  - 9006
  - 9007
  - 9008
  - 9009
  - 9010
  - 9011
  - 9012
  - 4566
  - 6080

# Optional: Mount directories from host to container
# mounts:
#   - "source=${localEnv:HOME}/.gu/example,target=/home/vscode/.gu/example,readonly,type=bind,consistency=cached"

# Optional: IDE plugins - shared project plugins like language support
plugins:
  vscode:
    - CucumberOpen.cucumber-official
  intellij: []

postCreateCommand:
  - cmd: "docker build --target dev -f e2e-tests/images/Dockerfile -t grid-e2e-dev ."
    workingDirectory: "."
  - cmd: "npm ci"
    workingDirectory: "./e2e-tests"
  - cmd: "./node_modules/.bin/playwright install chromium --with-deps"
    workingDirectory: "./e2e-tests"
  # VS Code picks up plugins installed by the Copilot CLI from ~/.copilot/installed-plugins.
  - cmd: "copilot plugin marketplace add guardian/agentsy && copilot plugin install feature-files@agentsy || echo \"Skipping feature-files plugin install\""
    workingDirectory: "."
