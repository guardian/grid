stacks:
  - media-service

regions:
  - eu-west-1

allowedStages:
  - TEST
  - PROD

templates:
  imgproxy-autoscaling:
    type: autoscaling
    app: imgproxy
    contentDirectory: imgproxy
    parameters:
    dependencies:
      - imgproxy-ami-update

deployments:
  imgproxy:
    template: imgproxy-autoscaling
    actions:
      - deploy

  imgproxy-ami-update:
    type: ami-cloudformation-parameter
    parameters:
      cloudFormationStackByTags: false
      cloudFormationStackName: media-service
      prependStackToCloudFormationStackName: false
      amiParametersToTags:
        ImgProxyAmiId:
          BuiltBy: amigo
          AmigoStage: PROD
          Recipe: grid-imgproxy-resolute
