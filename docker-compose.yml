x-grid-app: &grid-app
  profiles: ["containers"]
  pull_policy: never
  environment:
    JAVA_OPTS: >-
      -Duser.home=/grid-home
      -Daws.local.endpoint=http://localstack:4566
      -Des6.url=http://elasticsearch:9200
      -Dplay.http.secret.key=local-container-testing-only-not-a-secret-value
    AWS_ACCESS_KEY_ID: "test"
    AWS_SECRET_ACCESS_KEY: "test"
    AWS_REGION: "eu-west-1"
  volumes:
    - "${GRID_CONFIG_DIR:-${HOME}/.grid}:/grid-home/.grid:ro"
  depends_on:
    elasticsearch:
      condition: service_healthy
    localstack:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-grid-healthcheck: &grid-healthcheck
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
    environment:
      ES_JAVA_OPTS: "-Xms1024m -Xmx1024m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - "./dev/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml"
    ports:
      - "9200:9200"
  imgops:
    build:
      context: ./dev/imgops
    ports:
      - "9008:80"
    volumes:
      - "./dev/imgops/nginx.conf:/etc/nginx/nginx.conf"
  imgproxy:
    # See docs/06-objects-of-interest/03-imgproxy.md for the settings media-api's URLs rely on
    image: darthsim/imgproxy:v4.0.18
    ports:
      - "9016:8080"
    environment:
      # Only accept URLs signed by media-api. Must match imgproxy.key/salt in dev/script/generate-config/config.json5;
      # export both as empty (IMGPROXY_KEY= IMGPROXY_SALT=) to run unsigned
      IMGPROXY_KEY: "${IMGPROXY_KEY-52dd317a9689351c1af9c069677d8c0e7e5c061ab70c521fa6ec870f042f7bc0}"
      IMGPROXY_SALT: "${IMGPROXY_SALT-24cb8c5df205cefd31e667da2cea1ed56ee45c8f3c54b0e81065ee84690c493b}"
      IMGPROXY_HEALTH_CHECK_PATH: /health
      # Grid corrects orientation itself (rot:), as the cropper does
      IMGPROXY_AUTO_ROTATE: "false"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_KEEP_COPYRIGHT: "true"
      IMGPROXY_STRIP_COLOR_PROFILE: "true"
      IMGPROXY_ALLOW_ORIGIN: "*"
      IMGPROXY_ALLOWED_SOURCES: "s3://"
      # Read s3:// sources from localstack (in AWS this is the container's IAM role)
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://localstack:4566"
      IMGPROXY_S3_REGION: "eu-west-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    depends_on:
      - localstack
  cerebro:
    image: lmenezes/cerebro
    ports:
      - "9090:9000"
  localstack:
    image: localstack/localstack:4.5.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    expose:
      - 4566 # provide the imgops container with access to localstack's direct S3 endpoint
    networks:
      default:
        aliases:
          # queue URLs in the generated config use this hostname, which otherwise resolves to loopback in containers
          - sqs.eu-west-1.localhost.localstack.cloud
    environment:
      SERVICES: cloudformation,cloudwatch,dynamodb,kinesis,s3,sns,sqs,iam
      DEFAULT_REGION: eu-west-1
      KINESIS_ERROR_PROBABILITY: 0.0
    volumes:
      - "./dev/.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  oidc-provider:
    build:
      context: ./dev/oidc-provider
    ports:
      - "9014:9014"
    volumes:
      - "./dev/config/users.json:/etc/grid/users.json"
    env_file: ./dev/.env

  # --- Grid application containers (profile "containers") ---
  # Not started by a plain `docker compose up`. Build the images with `sbt Docker/publishLocal`, then run
  # `docker compose --profile containers up --wait` (see docs/01-setup/05-running-containers.md).
  # The apps run in the container as the DEV stage, reading the config generated into ~/.grid by dev/script/setup.sh,
  # with the endpoints that point at localhost overridden to the other compose services.
  auth:
    <<: *grid-app
    image: "auth:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9011:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  collections:
    <<: *grid-app
    image: "collections:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9010:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  cropper:
    <<: *grid-app
    image: "cropper:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9006:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  image-loader:
    <<: *grid-app
    image: "image-loader:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9003:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  kahuna:
    <<: *grid-app
    image: "kahuna:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9005:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  leases:
    <<: *grid-app
    image: "leases:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9012:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  media-api:
    <<: *grid-app
    image: "media-api:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9001:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  metadata-editor:
    <<: *grid-app
    image: "metadata-editor:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9007:9000"
    healthcheck:
      <<: *grid-healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/management/healthcheck"]
  thrall:
    <<: *grid-app
    image: "thrall:${GRID_IMAGE_VERSION:-DEV}"
    ports:
      - "9002:9000"
    healthcheck:
      <<: *grid-healthcheck
