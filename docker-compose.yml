services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
    environment:
      ES_JAVA_OPTS: "-Xms1024m -Xmx1024m"
    volumes:
      - "./dev/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml"
    ports:
      - "9200:9200"
  imgops:
    build:
      context: ./dev/imgops
    ports:
      - "9008:80"
    volumes:
      - "./dev/imgops/nginx.conf:/etc/nginx/nginx.conf"
  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
      - "9016:8080"
    environment:
      # Only accept URLs signed by media-api. Must match imgproxy.key/salt in dev/script/generate-config/config.json5
      IMGPROXY_KEY: "52dd317a9689351c1af9c069677d8c0e7e5c061ab70c521fa6ec870f042f7bc0"
      IMGPROXY_SALT: "24cb8c5df205cefd31e667da2cea1ed56ee45c8f3c54b0e81065ee84690c493b"
      IMGPROXY_HEALTH_CHECK_PATH: /health
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_STRIP_METADATA: "true"
      IMGPROXY_KEEP_COPYRIGHT: "true"
      IMGPROXY_ALLOW_ORIGIN: "*"
      IMGPROXY_ALLOWED_SOURCES: "http://localstack:4566/,s3://"
      # Read s3:// sources from localstack (in AWS this is the container's IAM role)
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://localstack:4566"
      IMGPROXY_S3_REGION: "eu-west-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    depends_on:
      - localstack
  cerebro:
    image: lmenezes/cerebro
    ports:
      - "9090:9000"
  localstack:
    image: localstack/localstack:4.5.0
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    expose:
      - 4566 # provide the imgops container with access to localstack's direct S3 endpoint
    environment:
      SERVICES: cloudformation,cloudwatch,dynamodb,kinesis,s3,sns,sqs,iam
      DEFAULT_REGION: eu-west-1
      KINESIS_ERROR_PROBABILITY: 0.0
    volumes:
      - "./dev/.localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
  oidc-provider:
    build:
      context: ./dev/oidc-provider
    ports:
      - "9014:9014"
    volumes:
      - "./dev/config/users.json:/etc/grid/users.json"
    env_file: ./dev/.env
